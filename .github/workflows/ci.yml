name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Releases (release.yml): the same build and tests, then the images are pushed under the version.
  workflow_call:
    inputs:
      version:
        description: Release version (yyyy.mm.rev), also the image tag
        type: string
        required: true
      prerelease:
        description: Push only the version tag, not the yyyy.mm series or latest
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The Compose release the image ships (docker/Dockerfile), ahead of the runner's own plugin:
      # its messages differ between versions, and the stack validation tests check them.
      - name: Install Compose
        run: |
          version=$(sed -n 's/^ARG COMPOSE_VERSION=//p' docker/Dockerfile)
          sum=$(sed -n 's/^ARG COMPOSE_SHA256_AMD64=//p' docker/Dockerfile)
          curl -fsSL -o "$RUNNER_TEMP/docker-compose" "https://github.com/docker/compose/releases/download/v${version}/docker-compose-linux-x86_64"
          echo "${sum}  $RUNNER_TEMP/docker-compose" | sha256sum -c -
          sudo install -m 755 "$RUNNER_TEMP/docker-compose" /usr/local/bin/docker-compose
          docker-compose version

      - name: Cache Tailwind CLI
        uses: actions/cache@v4
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ hashFiles('build/Tailwind.targets') }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release

  # The client and dashboard against each kind of engine (tests with Category=Integration).
  integration:
    runs-on: ubuntu-latest
    needs: build-test
    strategy:
      fail-fast: false
      matrix:
        engine: [docker, swarm, podman-rootful, podman-rootless]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The Compose release the image ships (docker/Dockerfile), ahead of the runner's own plugin:
      # its messages differ between versions, and the stack validation tests check them.
      - name: Install Compose
        run: |
          version=$(sed -n 's/^ARG COMPOSE_VERSION=//p' docker/Dockerfile)
          sum=$(sed -n 's/^ARG COMPOSE_SHA256_AMD64=//p' docker/Dockerfile)
          curl -fsSL -o "$RUNNER_TEMP/docker-compose" "https://github.com/docker/compose/releases/download/v${version}/docker-compose-linux-x86_64"
          echo "${sum}  $RUNNER_TEMP/docker-compose" | sha256sum -c -
          sudo install -m 755 "$RUNNER_TEMP/docker-compose" /usr/local/bin/docker-compose
          docker-compose version

      - name: Cache Tailwind CLI
        uses: actions/cache@v4
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ hashFiles('build/Tailwind.targets') }}

      - name: Start engine
        run: |
          case "${{ matrix.engine }}" in
            docker)
              echo "SOCKLESS_PORT_TEST_ENGINE=unix:///var/run/docker.sock" >> "$GITHUB_ENV"
              echo "SOCKLESS_PORT_TEST_EXPECT=docker" >> "$GITHUB_ENV"
              ;;
            swarm)
              docker swarm init
              echo "SOCKLESS_PORT_TEST_ENGINE=unix:///var/run/docker.sock" >> "$GITHUB_ENV"
              echo "SOCKLESS_PORT_TEST_EXPECT=swarm" >> "$GITHUB_ENV"
              ;;
            podman-rootful)
              sudo mkdir -p /run/podman
              sudo sh -c 'nohup podman system service --time=0 unix:///run/podman/podman.sock > /tmp/podman.log 2>&1 &'
              for i in $(seq 1 30); do sudo test -S /run/podman/podman.sock && break; sleep 1; done
              # The tests run as the runner user; open the socket to it as group_add would in production.
              # Podman's tmpfiles.d creates /run/podman as 0700 root, so the folder needs opening too.
              sudo chmod 755 /run/podman
              sudo chmod 666 /run/podman/podman.sock
              echo "SOCKLESS_PORT_TEST_ENGINE=unix:///run/podman/podman.sock" >> "$GITHUB_ENV"
              echo "SOCKLESS_PORT_TEST_EXPECT=podman" >> "$GITHUB_ENV"
              ;;
            podman-rootless)
              SOCK="$XDG_RUNTIME_DIR/podman/podman.sock"
              mkdir -p "$(dirname "$SOCK")"
              nohup podman system service --time=0 "unix://$SOCK" > /tmp/podman.log 2>&1 &
              for i in $(seq 1 30); do test -S "$SOCK" && break; sleep 1; done
              # Rootless bridge networks share one network namespace, torn down (by killing pasta) when
              # its last container stops. On the runner that kill sometimes fails with "permission denied",
              # failing whichever test stopped the last container. A container that outlives the tests
              # keeps the namespace up.
              podman --url "unix://$SOCK" network create sp-ci-keepalive
              podman --url "unix://$SOCK" run -d --name sp-ci-keepalive --network sp-ci-keepalive docker.io/library/busybox:1.37 sleep infinity
              echo "SOCKLESS_PORT_TEST_ENGINE=unix://$SOCK" >> "$GITHUB_ENV"
              echo "SOCKLESS_PORT_TEST_EXPECT=podman" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Integration tests
        run: dotnet test -c Release -- --filter-trait "Category=Integration"

      - name: Engine log
        if: failure() && startsWith(matrix.engine, 'podman')
        run: cat /tmp/podman.log || true

  # The server and the agent, built on every run and pushed only for releases.
  # Install commands name the agent image of the server's version.
  image:
    runs-on: ubuntu-latest
    needs: [build-test, integration]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - file: docker/Dockerfile
            image: ghcr.io/${{ github.repository }}
          - file: docker/Dockerfile.agent
            image: ghcr.io/${{ github.repository }}-agent
    env:
      VERSION: ${{ inputs.version }}
      RELEASE: ${{ inputs.version != '' }}
      STABLE: ${{ inputs.version != '' && !inputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # 2026.11.0 is also tagged 2026.11 (the month's latest revision) and latest.
      - name: Version
        id: version
        run: |
          echo "build=${VERSION:-0.0.0-dev}" >> "$GITHUB_OUTPUT"
          echo "series=${VERSION%.*}" >> "$GITHUB_OUTPUT"

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=${{ inputs.version }},enable=${{ env.RELEASE }}
            type=raw,value=${{ steps.version.outputs.series }},enable=${{ env.STABLE }}
            type=raw,value=latest,enable=${{ env.STABLE }}
            type=sha,enable=${{ env.RELEASE != 'true' }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.build }}
          flavor: |
            latest=false

      - name: Log in to GHCR
        if: env.RELEASE == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (push for releases only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: ${{ env.RELEASE == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.build }}
          cache-from: type=gha,scope=${{ matrix.file }}
          cache-to: type=gha,mode=max,scope=${{ matrix.file }}

name: Release

# Publishing a GitHub release builds, tests and pushes both images. The release's tag is the
# version, yyyy.mm.rev: the year, the month and a revision counting from 0 within that month
# (2026.11.0, 2026.11.1, 2026.12.0). See docs/releasing.md.
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Check the tag
        id: check
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! [[ "$TAG" =~ ^(20[0-9]{2})\.(1[0-2]|[1-9])\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release tag '$TAG' isn't a version: use yyyy.m.rev without a 'v' or leading zeros, for example 2026.11.0 or 2027.1.0."
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      packages: write
    with:
      version: ${{ needs.version.outputs.version }}
      prerelease: ${{ github.event.release.prerelease }}

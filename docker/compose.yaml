# Run Sockless Port on this host:
#   DOCKER_GID=$(stat -c %g /var/run/docker.sock) docker compose -f docker/compose.yaml up -d
# Then get the setup token for the first administrator:
#   docker logs sockless-port
name: sockless-port

services:
  sockless-port:
    image: ghcr.io/sockless-coding/sockless-port:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: sockless-port
    restart: unless-stopped
    ports:
      - "9000:8080"
    volumes:
      - port-data:/data
      # Engine access (used from the next release). Whoever controls this socket controls
      # the host, so keep Sockless Port behind authentication and off the public internet.
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      # Group that owns the socket on the host, so the non-root app user can use it.
      - "${DOCKER_GID:-999}"
    environment:
      # Set to true when running behind a reverse proxy that sets X-Forwarded-* headers.
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "false"

volumes:
  port-data:

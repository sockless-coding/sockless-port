# Run Sockless Port on this host:
#   DOCKER_GID=$(stat -c %g /var/run/docker.sock) docker compose -f docker/compose.yaml up -d
# Then get the setup token for the first administrator:
#   docker logs sockless-port
name: sockless-port

services:
  sockless-port:
    image: ghcr.io/sockless-coding/sockless-port:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: sockless-port
    restart: unless-stopped
    ports:
      - "9000:8080"
    volumes:
      - port-data:/data
      # Engine access. Whoever controls this socket controls the host, so keep Sockless Port
      # behind authentication and off the public internet. For Podman, mount its socket here
      # instead (see README).
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      # Group that owns the socket, so the non-root app user can use it.
      # Linux: stat -c %g /var/run/docker.sock. Docker Desktop: 0.
      - "${DOCKER_GID:-999}"
    environment:
      # Set to true when running behind a reverse proxy that sets X-Forwarded-* headers.
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "false"
      # Built-in HTTPS (publish "9443:8443" too); see README. Single sign-on: Port__Oidc__*.
      # Port__Https__Port: "8443"
      # Port__Https__HostNames__0: port.example.com

volumes:
  port-data:
